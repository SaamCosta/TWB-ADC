{% extends "main.html" %}

{% block content %}
<style>
  #map-canvas {
    border-radius: 8px;
    background: #1a2233;
    display: block;
    cursor: crosshair;
  }
  #map-tooltip {
    position: fixed; pointer-events: none;
    background: rgba(20,20,30,0.93); color: #f0f0f0;
    border-radius: 6px; padding: 8px 12px; font-size: 0.82rem;
    border: 1px solid #555; display: none; z-index: 9999; max-width: 220px;
  }
  .map-legend span { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
</style>

<div id="map-tooltip"></div>

<div class="row align-items-start">
  <!-- Canvas -->
  <div class="col-lg-10">
    <div class="card" style="border-color:#c8a96e;">
      <div class="card-body p-2">
        <canvas id="map-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Info panel -->
  <div class="col-lg-2">
    <div class="card mb-2" style="border-color:#c8a96e;">
      <div class="card-body p-2">
        <h6 class="card-title mb-2">Legenda</h6>
        <div id="map-legend" class="map-legend small"></div>
        <div id="map-diplomacy-note" class="small text-muted mt-2"></div>
      </div>
    </div>

    <div class="card mb-2" style="border-color:#c8a96e;">
      <div class="card-body p-2">
        <h6 class="card-title mb-2">Centrar em</h6>
        <select id="center-select" class="form-control form-control-sm" onchange="recenter()">
          {% for village in data.bot %}
          <option value="{{ village }}" {% if village == request.args.get('center') %}selected{% endif %}>
            {{ data.bot[village].public.name }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="card" style="border-color:#c8a96e;">
      <div class="card-body p-2">
        <h6 id="v_name" class="card-title mb-1">—</h6>
        <div id="v_data" class="small text-muted"></div>
      </div>
    </div>
  </div>
</div>

<script>
var mapData = {{ map | safe }};

(function () {
  var canvas = document.getElementById('map-canvas');
  var parent = canvas.parentElement;
  var W = parent.clientWidth - 4;
  var H = Math.max(480, Math.round(W * 0.65));
  canvas.width  = W;
  canvas.height = H;
  var ctx = canvas.getContext('2d');
  var tooltip = document.getElementById('map-tooltip');

  // grid[linha][coluna]: linha = y (cresce para o sul), coluna = x (leste),
  // como o jogo desenha. `origin` é a coordenada da célula [0][0].
  var grid   = mapData.grid;
  var extra  = mapData.extra || {};
  var colors = extra.colors || {};
  var origin = extra.origin || [0, 0];
  var rows  = Object.keys(grid).map(Number).sort(function(a,b){return a-b;});
  var cols  = rows.length > 0
    ? Object.keys(grid[rows[0]]).map(Number).sort(function(a,b){return a-b;})
    : [];

  function rgb(key) {
    var c = colors[key];
    return c ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')' : '#4a4a5a';
  }
  var labels = {};
  (extra.legend || []).forEach(function(item) { labels[item.key] = item.label; });

  // Legenda gerada da mesma paleta do canvas, para não poder divergir dele.
  (function buildLegend() {
    var box = document.getElementById('map-legend');
    (extra.legend || []).forEach(function(item) {
      var row = document.createElement('div');
      row.className = 'mb-1';
      var sw = document.createElement('span');
      sw.style.background = rgb(item.key);
      sw.style.border = '1px solid rgba(0,0,0,0.35)';
      row.appendChild(sw);
      row.appendChild(document.createTextNode(item.label));
      box.appendChild(row);
    });
    var note = document.getElementById('map-diplomacy-note');
    if (!extra.diplomacy_loaded) {
      note.textContent = 'Diplomacia ainda não lida pelo bot: aliados, PNA, ' +
        'inimigos e amigos aparecem como Outros até a próxima leitura da tela de mapa.';
    } else {
      var when = extra.diplomacy_fetched_at
        ? new Date(extra.diplomacy_fetched_at * 1000).toLocaleString('pt-BR') : '—';
      note.textContent = extra.relations_count + ' tribos com diplomacia, ' +
        extra.friends_count + ' amigos. Lido em ' + when + '.';
    }
  })();

  if (!rows.length || !cols.length) {
    ctx.fillStyle = '#ccc'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Nenhum dado de mapa disponível.', W/2, H/2);
    return;
  }

  // Margem de 28 px à esquerda e no topo para os rótulos de coordenada.
  var AXIS = 28;
  var CELL = Math.floor(Math.min((W - AXIS) / cols.length, (H - AXIS) / rows.length));
  CELL = Math.max(4, Math.min(CELL, 28));
  var offX = AXIS + Math.floor((W - AXIS - CELL * cols.length) / 2);
  var offY = AXIS + Math.floor((H - AXIS - CELL * rows.length) / 2);

  function cellColor(v) {
    if (!v) return '#2a3244';  // campo vazio
    return rgb(v.relation === 'barbarian' ? 'barbarian' : v.relation);
  }

  function draw() {
    // Background
    ctx.fillStyle = '#1a2233';
    ctx.fillRect(0, 0, W, H);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    rows.forEach(function(_, ri) {
      var y = offY + ri * CELL;
      ctx.beginPath(); ctx.moveTo(offX, y); ctx.lineTo(offX + cols.length*CELL, y); ctx.stroke();
    });
    cols.forEach(function(_, ci) {
      var x = offX + ci * CELL;
      ctx.beginPath(); ctx.moveTo(x, offY); ctx.lineTo(x, offY + rows.length*CELL); ctx.stroke();
    });

    // Cells
    rows.forEach(function(ri, rIdx) {
      cols.forEach(function(ci, cIdx) {
        var v = grid[ri] && grid[ri][ci];
        var x = offX + cIdx * CELL;
        var y = offY + rIdx * CELL;
        var color = cellColor(v);
        ctx.fillStyle = color;
        var pad = CELL > 8 ? 1 : 0;
        ctx.fillRect(x + pad, y + pad, CELL - pad*2, CELL - pad*2);

        // Contorno na aldeia atual: o branco dela some no fundo claro da célula.
        if (v && v.relation === 'this') {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + pad + 0.5, y + pad + 0.5, CELL - pad*2 - 1, CELL - pad*2 - 1);
        }
      });
    });

    // Rótulos de coordenada a cada 5 campos: x no topo, y à esquerda.
    ctx.fillStyle = 'rgba(200,200,200,0.7)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    cols.forEach(function(ci, cIdx) {
      var wx = origin[0] + ci;
      if (wx % 5 === 0) ctx.fillText(wx, offX + cIdx * CELL + CELL/2, offY - 4);
    });
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    rows.forEach(function(ri, rIdx) {
      var wy = origin[1] + ri;
      if (wy % 5 === 0) ctx.fillText(wy, offX - 4, offY + rIdx * CELL + CELL/2);
    });
  }

  draw();

  // Hit detection
  canvas.addEventListener('mousemove', function(e) {
    var rect  = canvas.getBoundingClientRect();
    var mx    = e.clientX - rect.left;
    var my    = e.clientY - rect.top;
    var cIdx  = Math.floor((mx - offX) / CELL);
    var rIdx  = Math.floor((my - offY) / CELL);
    if (cIdx < 0 || cIdx >= cols.length || rIdx < 0 || rIdx >= rows.length) {
      tooltip.style.display = 'none';
      document.getElementById('v_name').textContent = '—';
      document.getElementById('v_data').innerHTML = '';
      return;
    }
    var ri = rows[rIdx], ci = cols[cIdx];
    var v = grid[ri] && grid[ri][ci];
    if (!v) { tooltip.style.display = 'none'; return; }

    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';

    var ownerLabel = labels[v.relation] || '—';

    tooltip.innerHTML =
      '<strong>' + (v.name || '—') + '</strong>' +
      '<br/>' + ownerLabel +
      '<br/>Pontos: ' + (v.points || '—') +
      '<br/>Coord: ' + (v.location ? v.location[0] + '|' + v.location[1] : '—');

    document.getElementById('v_name').textContent = v.name || '—';
    var html = '';
    for (var k in v) {
      if (typeof v[k] !== 'object')
        html += '<strong>' + k + '</strong>: ' + v[k] + '<br/>';
    }
    document.getElementById('v_data').innerHTML = html;
  });

  canvas.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
  });
})();

function recenter() {
  var vid = document.getElementById('center-select').value;
  window.location.href = '/map?center=' + vid;
}
</script>
{% endblock %}
